[project]
name = "finance-tracker"
version = "0.1.0"
description = "ASX stock tracker for portfolio holdings, value, gain/loss, dividends, and price alerts"
readme = "README.md"
authors = [
    { name = "Teej", email = "tharanga.kast@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "textual>=8.2.8",
    "uvicorn>=0.52.4",
]

[project.scripts]
finance-tracker = "finance_tracker.tui.app:main"
finance-tracker-server = "finance_tracker.api.server:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
